[package]
name = "submissions"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_with = {version = "3.16.1", features = ["hex"]}
serde_json = "1.0"
hex = "0.4.3"
secp256k1 = { version = "0.31.1", features = ["global-context"] }
sha2 = "0.10.9"
hmac = "0.12.1"
chacha20 = "0.9.1"
